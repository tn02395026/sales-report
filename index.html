<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貓貓業績報表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#fff7ee;--card:#fff;--tx:#4a3b32;--sub:#9a8678;--pk:#ff9eb5;--or:#ffb26b;--gr:#6cc9a0;--rd:#f0757f;--bd:#f3dfcf}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#2a2320;--card:#362d29;--tx:#f5e9df;--sub:#bba999;--bd:#4d413b}}
:root[data-theme=dark]{color-scheme:dark;--bg:#2a2320;--card:#362d29;--tx:#f5e9df;--sub:#bba999;--bd:#4d413b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{padding:14px 16px 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:20px}h2{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:6px;padding:6px 16px;flex-wrap:wrap}
nav button,.btn{white-space:nowrap;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
nav button.on,.btn.pri{background:var(--pk);border-color:var(--pk);color:#4a2430;font-weight:600}
main{padding:8px 16px 40px;max-width:1000px;margin:auto}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:10px 12px}
.kpi b{display:block;font-size:18px}.kpi small{color:var(--sub)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px dashed var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child,.l{text-align:left}
th{color:var(--sub);font-weight:600}.pos{color:var(--gr)}.neg{color:var(--rd)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:6px 10px;max-width:100%}
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 2px}
dialog{border:3px solid var(--pk);border-radius:22px;background:var(--card);color:var(--tx);width:min(94vw,520px);max-height:90vh}
dialog::backdrop{background:#0006}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.row>*{flex:1}.row>button{flex:0}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;background:var(--bd)}
.ck{display:inline-flex;align-items:center;gap:4px;margin:4px 10px 4px 0;font-size:14px;color:var(--tx)}.ck input{width:auto;padding:0}
.cs{border-bottom:2px dashed var(--bd);padding:10px 2px}.cs .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.cs .amt{font-weight:700;white-space:nowrap}.cs .meta{margin:4px 0;font-size:12px;color:var(--sub)}.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:1px 9px;margin:2px 4px 2px 0;font-size:12px}.acts{text-align:right;margin-top:4px}
.kp2{display:flex;justify-content:space-between;align-items:center;gap:8px}.pc{text-align:right}.pc b{font-size:26px;color:#ff8a3d}
.pg{margin-top:10px;border-top:2px dashed var(--bd);padding-top:4px}.pg summary{cursor:pointer;padding:6px 0;font-size:14px}
.sl.deal th{background:#c87f2e;color:#fff;text-align:center}.sl.prob th{background:#1e6b3c;color:#fff;text-align:center}.sl td{white-space:pre-line;text-align:left;vertical-align:top}.sl .ft td{font-weight:700;text-align:right;background:var(--bg)}
.mini{padding:2px 10px;font-size:12px}.mood{font-size:30px}.sub{color:var(--sub);font-size:12px}
svg text{fill:var(--sub);font-size:10px}
</style></head><body>
<header><span class="mood">🐱</span><h1>貓貓業績報表</h1><select id="yr" onchange="Y=+this.value;render()"></select><span class="sub" id="sync"></span><button class="btn mini" id="auth" style="margin-left:auto">登入 Google</button></header>
<nav id="nav"></nav><main id="main"></main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),ST={signed:'已簽約',ongoing:'進行中',prob:'機率案件'};
let S={cases:[],targets:{},services:['LEED','WELL','EEWH','BERS','IB'],owners:[]},Y=new Date().getFullYear(),tab='report',ref=null,CM=new Date().getMonth()+1,filt='all',tmr;
const fmt=n=>Math.round(n).toLocaleString('en-US'),wan=n=>(n/1e4).toFixed(0)+'萬',E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tot=c=>c.lines.reduce((a,l)=>a+(+l.amt||0),0)+(+c.extra||0),uid=()=>Math.random().toString(36).slice(2,9);
const pct=(a,t)=>t?(a/t*100).toFixed(1)+'%':'—';
const own=c=>c.owners||(c.owner?[c.owner]:[]);
const getT=y=>S.targets[y]||(S.targets[y]=Array(12).fill(0));
const cls=n=>n>=0?'pos':'neg',sg=n=>(n>=0?'+':'−')+fmt(Math.abs(n));
function save(){try{localStorage.setItem('sr',JSON.stringify(S))}catch(e){}clearTimeout(tmr);tmr=setTimeout(()=>{window.cloudSave&&window.cloudSave(S)},800)}
function dedupe(){const seen=new Set(),out=[];S.cases.forEach(c=>{const k=JSON.stringify([c.name,c.contract||'',c.status,c.date||'',c.exp||'',c.prob,!!c.noCount,[...own(c)].sort(),c.lines.map(l=>[l.svc,Math.round(l.amt)]).sort()]);if(!seen.has(k)){seen.add(k);out.push(c)}});const n=S.cases.length-out.length;if(!n)return alert('沒有發現完全重複的案件 🐱');if(confirm(`找到 ${n} 件完全重複的案件，要刪除多的、各保留一件嗎？`)){S.cases=out;save();render()}}
function fixData(){const key=n=>n.trim().toLowerCase(),canon={};S.services.forEach(n=>{if(!SEP.test(n))canon[key(n)]=canon[key(n)]||n.trim()});
 const nm=n=>{n=n.trim();return canon[key(n)]||(canon[key(n)]=n)};
 S.cases.forEach(c=>{const m={};c.lines.forEach(l=>{const ps=String(l.svc).split(SEP).map(z=>z.trim()).filter(Boolean);ps.forEach(p=>{const k=nm(p);m[k]=(m[k]||0)+(ps.length>1?0:(+l.amt||0))});if(ps.length>1)c.extra=(c.extra||0)+(+l.amt||0)});c.lines=Object.entries(m).map(([svc,amt])=>({svc,amt}))});
 S.services=[...new Set(S.services.flatMap(n=>String(n).split(SEP)).map(z=>z.trim()).filter(Boolean).map(nm))]}
function cleanSave(){const b=JSON.stringify(S);fixData();if(JSON.stringify(S)!==b)save()}
function getS(){return S}
function loadRemote(d){S=Object.assign(S,d);cleanSave();try{localStorage.setItem('sr',JSON.stringify(S))}catch(e){}render()}
function stats(){const T=getT(Y),m=Array(12).fill(0),sv={},ong=[],pr={};
 const a=(n,k,v)=>{(sv[n]=sv[n]||{signed:0,ongoing:0,w:0,sn:0})[k]+=v};
 S.cases.forEach(c=>{if(c.noCount)return;const t=tot(c);
  if(c.status=='signed'){if(c.date&&+c.date.slice(0,4)==Y){m[+c.date.slice(5,7)-1]+=t;c.lines.forEach(l=>{a(l.svc,'signed',+l.amt||0);a(l.svc,'sn',1)})}}
  else if(!c.exp||+c.exp.slice(0,4)==Y){
   if(c.status=='ongoing'){ong.push(c);c.lines.forEach(l=>a(l.svc,'ongoing',+l.amt||0))}
   else{const p=+c.prob||0,g=pr[p]=pr[p]||{n:0,amt:0,w:0,cs:[]};g.cs.push(c);g.n++;g.amt+=t;g.w+=t*p/100;c.lines.forEach(l=>a(l.svc,'w',(+l.amt||0)*p/100))}}});
 return{T,m,sv,ong,pr}}
function chart(bars,lines,cols){const W=640,H=290,L=76,B=24,top=78,n=12,mx=Math.max(1,...bars,...lines.flat()),mn=Math.min(0,...lines.flat()),y=v=>top+(H-B-top)*(1-(v-mn)/(mx-mn)),x=i=>L+(W-L-8)*(i+.5)/n;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`}
 for(let i=0;i<n;i++)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${i+1}月</text>`;
 bars.forEach((v,i)=>s+=`<rect x="${x(i)-10}" y="${y(Math.max(v,0))}" width="20" height="${Math.abs(y(0)-y(v))}" rx="6" fill="var(--pk)"/>`);
 lines.forEach((l,j)=>{s+=`<polyline fill="none" stroke="${cols[j]}" stroke-width="3" stroke-linejoin="round" points="${l.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+l.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${cols[j]}"/>`).join('')});
 bars.forEach((v,i)=>{if(v)s+=`<text transform="translate(${x(i)+4},${y(Math.max(v,0))-5}) rotate(-90)" text-anchor="start" style="fill:var(--tx);font-size:10px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round">${fmt(v)}</text>`});
 return s+'</svg>'}
function report(){const{T,m,sv,ong,pr}=stats(),cT=T.reduce((a,b)=>a+b,0),sg_=m.reduce((a,b)=>a+b,0),cum=[],cumT=[];m.reduce((a,v,i)=>(cum[i]=a+v),0);T.reduce((a,v,i)=>(cumT[i]=a+v),0);
 const cmT=CM?cumT[CM-1]:0,cmA=CM?cum[CM-1]:0,gap=cmA-cmT,ongT=ong.reduce((a,c)=>a+tot(c),0),wT=Object.values(pr).reduce((a,g)=>a+g.w,0),pT=Object.values(pr).reduce((a,g)=>a+g.amt,0),f1=sg_+ongT,f2=f1+pT;
 const cmSel=`<select onchange="CM=+this.value;render()">${Array.from({length:13},(_,i)=>`<option value="${i}" ${i==CM?'selected':''}>${i?i+' 月底':'未開始'}</option>`).join('')}</select>`;
 let h=`<div class="card"><div class="row"><span class="mood">${gap>=0?'😸':'🙀'}</span><div>統計到 ${cmSel}<br><b class="${cls(gap)}">${gap>=0?'超前':'落後'} ${fmt(Math.abs(gap))} 元</b></div></div>
 <div class="grid"><div class="kpi"><small>累計目標</small><b>${fmt(cmT)}</b></div><div class="kpi kp2"><div><small>累計實際（已簽約）</small><b>${fmt(cmA)}</b><small class="${cls(cmA-cmT)}">${sg(cmA-cmT)}</small></div><div class="pc"><small>累計達成率</small><b>${pct(cmA,cmT)}</b></div></div><div class="kpi"><small>全年目標</small><b>${fmt(cT)}</b></div><div class="kpi kp2"><div><small>全年已簽約 / 差距</small><b>${fmt(sg_)}</b><small class="${cls(sg_-cT)}">${sg(sg_-cT)}</small></div><div class="pc"><small>年達成率</small><b>${pct(sg_,cT)}</b></div></div></div></div>
 <div class="card"><h2>🐾 每月實際（柱）vs 目標（線）單位：元</h2>${chart(m,[T],['#ff8a3d'])}</div>
 <div class="card"><h2>每月明細</h2><div class="wrap"><table><tr><th>月</th><th>目標</th><th>實際</th><th>月差距</th><th>累計目標</th><th>累計實際</th><th>累計差距</th></tr>`;
 m.forEach((v,i)=>h+=`<tr><td>${i+1}月</td><td>${fmt(T[i])}</td><td>${fmt(v)}</td><td class="${cls(v-T[i])}">${sg(v-T[i])}</td><td>${fmt(cumT[i])}</td><td>${fmt(cum[i])}</td><td class="${cls(cum[i]-cumT[i])}">${sg(cum[i]-cumT[i])}</td></tr>`);
 h+=`</table></div></div><div class="card"><h2>各服務項目（元）</h2><div class="wrap"><table><tr><th>服務</th><th>已簽約件數</th><th>已簽約金額</th><th>進行中金額</th><th>機率加權</th></tr>`;
 const names=[...new Set([...S.services,...Object.keys(sv)])];names.forEach(n=>{const o=sv[n]||{signed:0,ongoing:0,w:0,sn:0};h+=`<tr><td>${E(n)}</td><td>${o.sn}</td><td>${fmt(o.signed)}</td><td>${fmt(o.ongoing)}</td><td>${fmt(o.w)}</td></tr>`});
 h+=`</table></div><p class="sub">金額只計入「有列個別價格」的案件；沒列個別價格的案件只算件數，總金額仍計入上方各項統計。</p></div><div class="card"><h2>⏳ 進行中（已確定，跑合約／行政流程）</h2><p class="sub">${ong.length} 件，共 ${fmt(ongT)} 元</p>${list(ong)}</div>
 <div class="card"><h2>🎯 機率案件</h2><div class="wrap"><table><tr><th>機率</th><th>件數</th><th>金額</th><th>加權金額</th></tr>`;
 Object.keys(pr).sort((a,b)=>b-a).forEach(p=>h+=`<tr><td>${p}%</td><td>${pr[p].n}</td><td>${fmt(pr[p].amt)}</td><td>${fmt(pr[p].w)}</td></tr>`);
 h+=`</table></div>`;if(!Object.keys(pr).length)h+='<p class="sub">目前沒有機率案件 🐾</p>';
 Object.keys(pr).sort((a,b)=>b-a).forEach(p=>{const g=pr[p];h+=`<details open class="pg"><summary><b>${p}%</b>　${g.n} 件｜金額 ${fmt(g.amt)}｜加權 ${fmt(g.w)}</summary>${list(g.cs)}</details>`});
 const fk=(t,v)=>`<div class="kpi kp2"><div><small>${t}</small><b>${fmt(v)}</b><small class="${cls(v-cT)}">${sg(v-cT)}</small></div><div class="pc"><small>達成率</small><b>${pct(v,cT)}</b></div></div>`;
 h+=`</div><div class="card"><h2>🔮 預估（對全年目標）</h2><div class="grid">${fk('已簽約 + 進行中',f1)}${fk('已簽約 + 進行中 + 機率案件',f2)}</div><p class="sub">已簽約 ${fmt(sg_)} + 進行中 ${fmt(ongT)}${pT?` + 機率案件 ${fmt(pT)}（未加權）`:''}</p></div>`;return h}
function list(a){return a.length?a.map(c=>`<div class="cs"><div class="top"><b>${E(c.name)}</b><span class="amt">${fmt(tot(c))}</span></div><div class="meta"><span class="tag">${ST[c.status]}${c.status=='prob'?' '+(c.prob||0)+'%':''}</span>${c.noCount?' <span class="tag">不計業績</span>':''} ${c.status=='signed'?'簽約 '+E(c.date):(c.exp?'預計 '+E(c.exp):'')}</div><div>${c.lines.map(l=>`<span class="chip">${E(l.svc)}${l.amt>0?' '+fmt(l.amt):''}</span>`).join('')}</div>${c.action?`<div class="sub">📝 ${E(c.action)}</div>`:''}<div class="sub">${own(c).length?'👤 '+E(own(c).join('、')):''}${c.contract?' ・ 📄 '+E(c.contract):''}</div><div class="acts"><button class="btn mini" onclick="edit('${c.id}')">編輯</button> <button class="btn mini" onclick="del('${c.id}')">刪除</button></div></div>`).join(''):'<p class="sub">還沒有資料 🐾</p>'}
let q='';
const fc=()=>S.cases.filter(c=>(filt=='all'||c.status==filt)&&(!q||(c.name+(c.contract||'')+own(c).join('')).toLowerCase().includes(q.toLowerCase()))).sort((x,y)=>(y.date||y.exp||'').localeCompare(x.date||x.exp||''));
const cl=()=>{const a=fc();return `<p class="sub">共 ${a.length} 件</p>`+list(a)};
function cases(){return `<div class="card"><div class="row"><button class="btn pri" onclick="edit()">＋ 新增</button><select onchange="filt=this.value;render()"><option value="all">全部狀態</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k==filt?'selected':''}>${v}</option>`).join('')}</select></div><input placeholder="🔍 搜尋專案、合約、負責人" value="${E(q)}" oninput="q=this.value;$('#cl').innerHTML=cl()" style="width:100%;margin:6px 0"><div id="cl">${cl()}</div></div>`}
/*DECK_START*/
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];let PM=new Date().getMonth()+1;
const cn=t=>String(t||'').replace(/(\d{6}(?:-\d{2})?(?:~\d{2})?)[ \t]+(?=\S)/g,'$1\n').replace(/[、;；][ \t]*/g,'\n').trim();
const svT=c=>c.svcText||c.lines.map(l=>l.svc).join(' '),mem=c=>own(c).join(' '),px=c=>fmt(tot(c))+(c.noCount?' (不計入業績)':''),sub=a=>a.filter(c=>!c.noCount).reduce((t,c)=>t+tot(c),0),cnt=a=>a.filter(c=>!c.noCount).length;
function deckData(){const ms=`${MN[PM-1]} ${Y}`,D=['Contract No.','Project name','Project Member','Services','Price (Tax excluded)'],out=[];
 const cl=S.cases.filter(c=>c.status=='signed'&&(c.date||'').slice(0,4)==Y&&+(c.date||'').slice(5,7)==PM).sort((a,b)=>a.date.localeCompare(b.date)),g=getT(Y)[PM-1]||0,sc=sub(cl);
 out.push({kind:'deal',title:`Deal Closed- ${ms} (${cnt(cl)}件)`,head:D,cw:[3,3.2,1.4,3,1.7],rows:cl.map(c=>[cn(c.contract),c.name,mem(c),svT(c),px(c)]),foot:[['SUBTOTAL',fmt(sc)],['GOAL',fmt(g)],['Difference',(sc-g>=0?'+':'-')+fmt(Math.abs(sc-g))]]});
 const og=S.cases.filter(c=>c.status=='ongoing');
 if(og.length)out.push({kind:'deal',title:`Deal in progress (${cnt(og)}件)`,head:D,cw:[3,3.2,1.4,3,1.7],rows:og.map(c=>[cn(c.contract)||'TBC',c.name,mem(c),svT(c),px(c)]),foot:[['SUBTOTAL',fmt(sub(og))]]});
 const pg={};S.cases.filter(c=>c.status=='prob').forEach(c=>(pg[+c.prob||0]=pg[+c.prob||0]||[]).push(c));
 Object.keys(pg).sort((a,b)=>b-a).forEach(p=>out.push({kind:'prob',title:`High probability in ${ms}- ${p}%↑`,head:['Project Name','Services','Price (Tax excluded)','Action Item'],cw:[3.6,3.4,1.7,3.6],rows:pg[p].map(c=>[c.name,svT(c),px(c),c.action||'']),foot:[['SUBTOTAL',fmt(sub(pg[p]))]]}));
 return out}
function deckTab(){const d=deckData();return `<div class="card"><div class="row"><select onchange="PM=+this.value;render()">${MN.map((m,i)=>`<option value="${i+1}" ${i+1==PM?'selected':''}>${Y} ${m}</option>`).join('')}</select><button class="btn pri" onclick="dlPptx()">⬇️ 下載 PPTX</button></div><p class="sub">已簽約依簽約日歸月份；GOAL 取自設定頁的月目標；標示「不計入業績」的案件會列出，但不算進 SUBTOTAL 與件數。</p></div>`+d.map(sl=>`<div class="card sl ${sl.kind}"><h2 style="text-align:center">${E(sl.title)}</h2><div class="wrap"><table><tr>${sl.head.map(h=>`<th>${h}</th>`).join('')}</tr>${sl.rows.map(r=>`<tr>${r.map(t=>`<td>${E(t)}</td>`).join('')}</tr>`).join('')}${sl.foot.map(f=>`<tr class="ft">${sl.kind=='deal'?`<td colspan="3"></td><td>${f[0]}</td><td>${f[1]}</td>`:`<td></td><td>${f[0]}</td><td>${f[1]}</td><td></td>`}</tr>`).join('')}</table></div></div>`).join('')}
function buildPptx(P){P.layout='LAYOUT_WIDE';const F='Microsoft JhengHei';
 deckData().forEach(sl=>{const s=P.addSlide(),hc=sl.kind=='deal'?'C87F2E':'1E6B3C';
  s.addText(sl.title,{x:.5,y:.2,w:12.3,h:.6,fontSize:24,align:'center',fontFace:F,color:'555555',isTextBox:true});
  const hd=sl.head.map(t=>({text:t,options:{bold:true,color:'FFFFFF',fill:{color:hc},align:'center',fontFace:F}})),bd=sl.rows.map((r,i)=>r.map(t=>({text:String(t),options:{fontFace:F,fill:{color:i%2?'FFFFFF':'F7F3EE'}}}))),
  ft=sl.foot.map(f=>(sl.kind=='deal'?['','','',f[0],f[1]]:['',f[0],f[1],'']).map(t=>({text:t,options:{bold:true,fontFace:F,align:t?'right':'left'}})));
  s.addTable([hd,...bd,...ft],{x:.5,y:.95,w:12.3,colW:sl.cw,fontSize:10,border:{type:'solid',pt:.5,color:'DDDDDD'},valign:'middle',autoPage:true,autoPageRepeatHeader:true,autoPageSlideStartY:.5})})}
function dlPptx(){if(!window.PptxGenJS)return alert('簡報元件載入失敗，請檢查網路後重試');const P=new PptxGenJS();buildPptx(P);P.writeFile({fileName:`業績簡報_${Y}-${String(PM).padStart(2,'0')}.pptx`})}

function settings(){const T=getT(Y);
 return `<div class="card"><h2>${Y} 年每月目標（元）</h2><div class="row"><input id="allT" type="number" placeholder="全年同額"><button class="btn" onclick="fillT()">套用</button></div><div class="grid">${T.map((v,i)=>`<div><label>${i+1}月</label><input type="number" value="${v}" onchange="getT(Y)[${i}]=+this.value||0;save()"></div>`).join('')}</div></div>
 ${['services','owners'].map(k=>`<div class="card"><h2>${k=='services'?'服務項目':'負責人名單'}</h2>${S[k].map((n,i)=>`<span class="tag">${E(n)} <a href="#" onclick="rm('${k}',${i});return false">✕</a></span> `).join('')}<div class="row" style="margin-top:8px"><input id="n_${k}" placeholder="新增…"><button class="btn" onclick="addI('${k}')">加</button></div></div>`).join('')}
 <div class="card"><h2>Excel</h2><div class="row"><button class="btn" onclick="tpl()">下載範本</button><button class="btn" onclick="exp()">匯出全部</button><button class="btn pri" onclick="$('#fi').click()">匯入</button></div><div class="row"><button class="btn" onclick="dedupe()">🧹 清除重複的案件</button></div><input id="fi" type="file" accept=".xlsx,.xls,.csv" hidden onchange="imp(this.files[0]);this.value=''"><p class="sub">匯入時，合約編號相同的案件會直接更新（覆蓋）；沒有合約編號的，以專案名稱＋狀態判斷是否同一筆。</p></div>`}
function fillT(){const v=+$('#allT').value||0;S.targets[Y]=Array(12).fill(v);save();render()}
function addI(k){const v=$('#n_'+k).value.trim();if(v&&!S[k].includes(v)){S[k].push(v);save();render()}}
function rm(k,i){S[k].splice(i,1);save();render()}
function del(id){if(confirm('確定刪除這個案件？')){S.cases=S.cases.filter(c=>c.id!=id);save();render()}}
function opts(a,v){return a.map(x=>`<option ${x==v?'selected':''}>${E(x)}</option>`).join('')}
function lineRow(l){return `<div class="row"><select class="ls">${opts(S.services,l.svc)}</select><input class="la" type="number" placeholder="金額(選填)" value="${l.amt||''}"><button class="btn mini" type="button" onclick="this.parentNode.remove()">✕</button></div>`}
function edit(id){const c=S.cases.find(x=>x.id==id)||{id:uid(),status:'prob',lines:[{svc:S.services[0],amt:''}],prob:90,_new:1};
 $('#dlg').innerHTML=`<h2>${c._new?'新增':'編輯'}案件 🐱</h2><label>專案名稱</label><input id="f_name" value="${E(c.name)}" style="width:100%"><label>負責人（可複選）</label><div id="f_owner">${S.owners.length?S.owners.map(o=>`<label class="ck"><input type="checkbox" value="${E(o)}" ${own(c).includes(o)?'checked':''}> ${E(o)}</label>`).join(''):'<span class="sub">請先到設定頁新增負責人</span>'}</div><label>合約編號</label><input id="f_con" value="${E(c.contract)}"><label>狀態</label><select id="f_st" onchange="stv()">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k==c.status?'selected':''}>${v}</option>`).join('')}</select>
 <div id="g_date"><label>簽約日（業績月份依此計算）</label><input id="f_date" type="date" value="${c.date||''}"></div><div id="g_exp"><label>預計簽約月份</label><input id="f_exp" type="month" value="${c.exp||''}"></div><div id="g_p"><label>成功機率 %</label><input id="f_p" type="number" min="0" max="100" value="${c.prob??90}"></div>
 <label class="ck" style="margin-top:12px"><input type="checkbox" id="f_nc" ${c.noCount?'checked':''}> 不計入業績統計（只記錄，不算進報表）</label><label>服務項目（個別金額選填）</label><div id="lines">${c.lines.map(lineRow).join('')}</div><button class="btn mini" type="button" onclick="$('#lines').insertAdjacentHTML('beforeend',lineRow({svc:S.services[0]}))">＋ 服務</button><label>服務說明（簡報顯示用，選填，例：LEED 銀級 LEED CxA）</label><input id="f_svt" value="${E(c.svcText)}" style="width:100%"><label>行動事項／備註（簡報用，選填）</label><textarea id="f_ac" rows="2" style="width:100%">${E(c.action)}</textarea><label>未分項的金額（元，未稅）</label><input id="f_ex" type="number" value="${c.extra||''}" placeholder="沒列個別價格時，在這裡填總金額"><div class="sub">有填上面個別金額的話，總金額 = 個別金額加總 + 這一欄</div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="$('#dlg').close()">取消</button><button class="btn pri" onclick="saveC('${c.id}',${!!c._new})">儲存</button></div>`;stv();$('#dlg').showModal()}
function stv(){const s=$('#f_st').value;$('#g_date').hidden=s!='signed';$('#g_exp').hidden=s=='signed';$('#g_p').hidden=s!='prob'}
function saveC(id,isNew){const s=$('#f_st').value,lines=[...document.querySelectorAll('#lines .row')].map(r=>({svc:r.querySelector('.ls').value,amt:+r.querySelector('.la').value||0})),name=$('#f_name').value.trim();
 if(!name)return alert('請填專案名稱');if(s=='signed'&&!$('#f_date').value)return alert('已簽約需要填簽約日');
 const c={id,name,owners:[...document.querySelectorAll('#f_owner input:checked')].map(i=>i.value),contract:$('#f_con').value.trim(),status:s,date:s=='signed'?$('#f_date').value:'',exp:s!='signed'?$('#f_exp').value:'',prob:s=='prob'?+$('#f_p').value||0:100,noCount:$('#f_nc').checked,extra:+$('#f_ex').value||0,svcText:$('#f_svt').value.trim(),action:$('#f_ac').value.trim(),lines};
 if(isNew)S.cases.push(c);else S.cases[S.cases.findIndex(x=>x.id==id)]=c;save();$('#dlg').close();render()}
function dl(name,wb){try{XLSX.writeFile(wb,name)}catch(e){alert('下載失敗：'+e.message)}}
const HD=['專案名稱','負責人','合約編號','服務項目','狀態','簽約日','預計簽約月','機率(%)','金額(元)','計入業績(是/否)','服務說明','行動事項'];
function tpl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HD,['範例A案','小明、小美','C-001','LEED','已簽約','2026-03-15','','',4000000,'是'],['範例A案','小明、小美','C-001','WELL','已簽約','2026-03-15','','',1000000,'是'],['範例B案','小美','','BERS','進行中','','2026-11','',800000,'是'],['範例C案','小明','','EEWH','機率案件','','2026-12',90,600000,'是']]),'案件');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['一個服務項目一列；同一案件（專案名稱＋合約編號相同）會自動合併。'],['狀態只能填：已簽約／進行中／機率案件'],['已簽約填「簽約日」；進行中、機率案件填「預計簽約月」(例 2026-11)；機率案件另填機率'],['金額為未稅、元，請只填數字'],['負責人、服務項目可複選：用「、」或「,」分隔（例 小明、小美／LEED、WELL）'],['服務項目有多項時：金額用「、」依序對應各服務（例 4000000、1000000）；若只填一個總金額，就只記總金額，不會分攤到各服務'],['不想計入業績的案件，「計入業績」填「否」，其他填「是」或留空']]),'說明');dl('業績匯入範本.xlsx',wb)}
function exp(){const r=[HD];S.cases.forEach(c=>{const row=(sv,am)=>r.push([c.name,own(c).join('、'),c.contract,sv,ST[c.status],c.date,c.exp,c.status=='prob'?c.prob:'',am,c.noCount?'否':'是',c.svcText||'',c.action||'']),al=c.lines.filter(l=>l.amt>0),un=c.lines.filter(l=>!(l.amt>0));al.forEach(l=>row(l.svc,l.amt));if(un.length||c.extra>0)row(un.map(l=>l.svc).join('、'),c.extra||'')});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'案件');dl('業績資料匯出.xlsx',wb)}
const nd=v=>{if(v instanceof Date)return new Date(v.getTime()+432e5-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);const m=String(v||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''},nm=v=>{const d=nd(v);if(d)return d.slice(0,7);const m=String(v||'').match(/(\d{4})[\/\-.](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}`:''};
const SEP=/[,、;，；\/／\n]+/;
function amts(v){if(typeof v=='number')return[v];const t=String(v).trim();if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t))return[+t.replace(/,/g,'')];return t.split(SEP).map(z=>z.trim()).filter(Boolean).map(z=>+z.replace(/,/g,''))}
function imp(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),map={},err=[],dup=new Set(),avg=[],sk={};
 Object.entries(ST).forEach(([k,v])=>sk[v]=k);
 rows.forEach((x,i)=>{const n=i+2,name=String(x['專案名稱']).trim();if(!name)return;const st=sk[String(x['狀態']).trim()],svs=String(x['服務項目']).split(SEP).map(z=>z.trim()).filter(Boolean),con=String(x['合約編號']).trim();let am=amts(x['金額(元)']);
  if(!st)return err.push(`第${n}列：狀態「${x['狀態']}」不認得`);
  if(!svs.length||!am.length||am.some(isNaN))return err.push(`第${n}列：服務項目或金額有問題`);
  const un=am.length==1&&svs.length>1;if(!un&&am.length!=svs.length)return err.push(`第${n}列：服務有 ${svs.length} 項，但金額有 ${am.length} 個`);
  const date=nd(x['簽約日']);if(st=='signed'&&!date)return err.push(`第${n}列：已簽約需要正確的簽約日`);
  const k=[name,con,st].join('|');const c=map[k]=map[k]||{id:uid(),name,owners:String(x['負責人']).split(/[,、;，；\/／\s]+/).map(t=>t.trim()).filter(Boolean),contract:con,status:st,date:st=='signed'?date:'',exp:st!='signed'?nm(x['預計簽約月']):'',prob:st=='prob'?+x['機率(%)']||0:100,noCount:String(x['計入業績(是/否)']).trim()=='否',svcText:String(x['服務說明']||'').trim(),action:String(x['行動事項']||'').trim(),lines:[]};
  if(un)c.extra=(c.extra||0)+am[0];svs.forEach((v,j)=>{c.lines.push({svc:v,amt:un?0:am[j]});if(!S.services.includes(v))S.services.push(v)});c.owners.forEach(o=>{if(!S.owners.includes(o))S.owners.push(o)});if(con&&S.cases.some(z=>z.contract==con))dup.add(con)});
 const a=Object.values(map),old=S.cases.slice();let nAdd=0,nUp=0;
 a.forEach(c=>{const i=old.findIndex(z=>c.contract?z.contract==c.contract:(!z.contract&&z.name==c.name&&z.status==c.status));if(i<0){S.cases.push(c);nAdd++}else{c.id=old[i].id;S.cases[S.cases.indexOf(old[i])]=c;nUp++}});
 save();render();alert(`匯入完成：新增 ${nAdd} 件，更新（覆蓋）${nUp} 件。`+(err.length?`\n\n未匯入：\n`+err.slice(0,10).join('\n'):''))}catch(x){alert('讀取失敗：'+x.message)}};r.readAsArrayBuffer(f)}
function render(){const ys=new Set([Y,new Date().getFullYear(),new Date().getFullYear()+1,...Object.keys(S.targets).map(Number),...S.cases.map(c=>+(c.date||c.exp||'0').slice(0,4)).filter(Boolean)]);
 $('#yr').innerHTML=[...ys].sort().map(y=>`<option value="${y}" ${y==Y?'selected':''}>${y} 年</option>`).join('');
 $('#nav').innerHTML=[['report','📊 報表'],['cases','📋 案件'],['deck','📑 簡報'],['settings','⚙️ 設定']].map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('');
 $('#main').innerHTML=({report,cases,deckTab,settings}[tab=='deck'?'deckTab':tab])()}
(()=>{try{const l=JSON.parse(localStorage.getItem('sr'));if(l)S=Object.assign(S,l)}catch(e){}cleanSave();render()})();
